# hostreload, case (a): Falls = Try
# Again (SMG_MP_DOWNED=1). The guest defeats 3 enemies at 5 s (SMG_MP_TEST_KILL, desktop hook: the KILLs go to the host); at 40 s the HOST alone falls
# (1 life, no bubble) and restarts from the checkpoint (its own move type 5, same serial) while the guest stays in the scene. The shared world
# continues: the host re-applies what it had ("world reload carry applied") and sends the full state to everyone ("objmap sent kill=3 ... to=-1"); nothing is resurrected.
# Before: the host rebuilt an empty registry, showed the 3 enemies alive and handed out kill=0.
name: host_tryagain_keeps_world
description: "guest clears 3 enemies, the host alone falls and takes Try Again: the 3 defeats stay (carry applied, objmap kill=3)"
seconds: 300
requires: {strings: [SMG_MP_AUTO_MODE, SMG_MP_TEST_KILL, SMG_MP_TEST_DIE, SMG_MP_DOWNED]}
env: {PETARI_GAME_CLOCK: 1, PETARI_SHOT_MS: 8000}
processes:
  - name: host
    input: "@file2_observatory+30"
    env: {SMG_MP_AUTO: host, SMG_MP_AUTO_SAVE: "copy:2", SMG_MP_AUTO_MODE: together, SMG_MP_AUTO_START: 2, PETARI_STAGE: "EggStarGalaxy:1", SMG_MP_DOWNED: 1,
          SMG_MP_TEST_DIE: "40:0:abyss", SMG_MP_TEST_LIVES: 1}
  - name: guest
    input: "@file2_observatory"
    env: {SMG_MP_AUTO: join, SMG_MP_LOOK: 1, SMG_MP_TEST_KILL: "5:3"}
rules:
  - 'absent * /\[mp\] world pool ranges overflow/'
  - 'distinct host /\[mp\] world reg n=\d+ crc=([0-9a-f]+) / == 1'   # the same placement gives the same registry CRC after the reload
  - 'distinct guest /\[mp\] world reg n=\d+ crc=([0-9a-f]+) / == 1'
  - 'same host,guest /\[mp\] world reg n=(\d+) crc=([0-9a-f]+) / last'
  - 'nocrash *'
  - 'nostall *'
  - 'save_guard *'
  - 'expect guest /\[mp\] world test kill: killed=3 serial=\d+/'
  - 'count host /\[mp\] world kill key=\S+ src=remote/ >= 3'
  - 'expect host /\[mp\] flow local move type=5 galaxy=EggStarGalaxy serial=\d+ role=host/'
  - 'expect host /\[mp\] world reload carry armed kill=[3-9] / after host /\[mp\] flow local move type=5/'
  - 'expect host /\[mp\] world reload carry applied n=[3-9] / within 60s after host /\[mp\] world reload carry armed/'
  # the host sends the full state to everyone after the re-apply (the guest did not reload and asked for nothing)
  - 'expect host /\[mp\] world objmap sent kill=[3-9] purple=\d+ chip=\d+ chunks=[1-9]\d* to=-1/ after host /\[mp\] world reload carry applied/'
  - 'absent guest /\[mp\] world kill key=\S+ src=remote/'   # the guest already has the defeats: nothing is applied (nothing resurrected, nothing re-killed)
  - 'absent * /\[mp\] bubble (on|msg|remote on|restart)/'
  - 'absent guest /\[mp\] flow (own|local) move type=[57]/'
  - 'absent host /\[mp\] world reload carry dropped/'
  - 'absent * /\[mp\] world regcrc mismatch/'
  - 'absent host /\[mp\] world drop type=kill/'
  - 'absent * /\[mp\] bad message from slot|events lost/'
