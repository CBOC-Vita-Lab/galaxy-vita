# ingame: the in-play presentation (toasts only for what cannot be seen, brief name tags, edge heads, the strip's arrivals, the
# watch badge, the bubble's button prompt, the life counter's own head). Built on touches_shots: the host (Cosmic Mario) takes both
# to Good Egg 1; the guest (Toad) joins, says a phrase ("Hello!") and "Be right back", the host walks off (off the guest's screen:
# the edge head), then the guest falls into a bubble and watches the host.
name: pics_edge
description: pictures - the host sees the guest's edge head (the guest walks sideways out of the picture)
shot_size: 960x544
seconds: 260
requires: {strings: [SMG_MP_AUTO_MODE]}
env: {PETARI_GAME_CLOCK: 1, PETARI_SHOT_MS: 1500, PETARI_HANDHELD_UI: 1, PETARI_BACKEND: vgx}
processes:
  - name: host
    input: "@file2_observatory+30"
    env: {SMG_MP_AUTO: host, SMG_MP_AUTO_SAVE: "copy:2", SMG_MP_AUTO_MODE: together, SMG_MP_AUTO_START: 2, PETARI_STAGE: "EggStarGalaxy:1",
          SMG_MP_NAME: Rosalina, SMG_MP_LOOK: 3}
  - name: guest
    input: "@pics_edge_guest"
    env: {SMG_MP_AUTO: join, SMG_MP_NAME: Toadette, SMG_MP_LOOK: 2}
rules:
  - 'nocrash *'
  - 'save_guard *'
