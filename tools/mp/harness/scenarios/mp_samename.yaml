# two players named Alex: the second shows as Alex 2
name: mp_samename
description: "two players with the same name: the second is Alex 2"
seconds: 200
requires: {strings: [SMG_MP_AUTO_MODE]}
env: {PETARI_GAME_CLOCK: 1, PETARI_SHOT_MS: 10000}
processes:
  - name: host
    input: "@file2_observatory+30"
    env: {SMG_MP_AUTO: host, SMG_MP_AUTO_SAVE: "copy:2", SMG_MP_AUTO_MODE: together, SMG_MP_AUTO_START: 2, PETARI_STAGE: "EggStarGalaxy:1", SMG_MP_NAME: Alex}
  - name: guest
    input: "@file2_observatory"
    env: {SMG_MP_AUTO: join, SMG_MP_NAME: Alex}
rules:
  - 'nocrash *'
  - 'save_guard *'
  - 'absent * /save check self-test failed/'
  - 'expect * /\[mp\] save check limits galaxies=[1-9]\d* /'
  - 'nostall *'
  - 'expect host /\[mp\] slot 1 joined name=Alex 2 /'
  - 'absent * /Assertion|OSPanic|FATAL/'
  - 'exit host,guest == 0'
