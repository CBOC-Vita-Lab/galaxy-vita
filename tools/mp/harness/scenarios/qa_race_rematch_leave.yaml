# QA-FUNC 6/15. Star Race: the host picks Race Again after race 1; in race 2 the GUEST presses Leave Race on the results card (the one live row of a
# non-leader's card). mp_race_series (menu path) checks the host's two choices; the guest's Leave Race press was unit-tested only
# (tests/mp/ui_menu/raceleave_test.cpp). The hook SMG_MP_TEST_RACE_LEAVE="<card n>[:<secs>]" (MpUiSystem.cpp, next to the results card's input) presses OK
# on the n-th card with choices, <secs> after it came up: resultsInput -> takeResultsLeave -> leaveByUs, the player's own path. It logs
# "race test leave n"; the press logs "ui: results leave pressed" and "race leave slot=<n>".
# Expected: only the guest leaves (BYE), the host's card stays and the host then leaves with its own choice 3 (Leave Race); no race 3 starts.
# SKIPs until the binary has SMG_MP_TEST_RACE_LEAVE.
name: qa_race_rematch_leave
description: "Star Race: Race Again, then the guest leaves on the results card; the host stays on its card, then leaves; no third race"
seconds: 600
requires: {strings: [SMG_MP_TEST_RACE_LEAVE]}
env: {PETARI_GAME_CLOCK: 1, PETARI_SHOT_MS: 10000}
processes:
  - name: host
    may_end_early: true   # ends by its HARNESS_END mark (the early-exit preflight would call the run INVALID)
    input: "@file2_observatory+30"
    env: {SMG_MP_AUTO: host, SMG_MP_AUTO_SAVE: "copy:2", SMG_MP_AUTO_MODE: race, SMG_MP_AUTO_START: 2, PETARI_STAGE: "EggStarGalaxy:1",
          SMG_MP_TEST_STAR: 25, SMG_MP_TEST_CHOICE: "1,3:30", SMG_MP_AUTO_LEAVE: discard, HARNESS_END: '\[mp\] race test choice 3|15'}
  - name: guest
    may_end_early: true   # ends by its HARNESS_END mark (the early-exit preflight would call the run INVALID)
    input: "@file2_observatory"
    env: {SMG_MP_AUTO: join, SMG_MP_LOOK: 1, SMG_MP_TEST_STAR: 15, SMG_MP_TEST_RACE_LEAVE: "2:6", SMG_MP_AUTO_LEAVE: discard,
          HARNESS_END: '\[mp\] ui: session ended by=us |10'}
rules:
  - 'nocrash *'
  - 'nostall *'
  - 'absent * /Assertion|OSPanic|FATAL|ASSERT/'
  - 'save_guard *'
  - 'absent * /save check self-test failed/'
  - 'expect * /\[mp\] save check limits galaxies=[1-9]\d* /'
  - 'expect host /\[mp\] race results serial=(\d+) n=2 first=\d/'
  - 'expect host /\[mp\] race test choice 1/'
  - 'expect guest /\[mp\] race host choice 1 serial=\d+/ within 3s after host /\[mp\] race test choice 1/'
  - 'count host /\[mp\] race results serial=\d+ n=2 / >= 2'
  - 'count guest /\[mp\] ui: results shown count=2 / >= 2'
  - 'expect guest /\[mp\] race test leave 2/'
  - 'expect guest /\[mp\] race leave slot=1/'
  - 'order guest /\[mp\] race leave slot=1/ before host /\[mp\] race test choice 3/ within 60s'
  - 'absent host /\[mp\] race leave /'
  - 'order guest /\[mp\] ui: results leave pressed/ before host /\[mp\] slot 1 left reason=leave \(bye\)/ within 8s'
  - 'expect guest /\[mp\] ui: session ended by=us /'
  - 'absent host /\[mp\] ui: results leave pressed/ before host /\[mp\] slot 1 left/'
  - 'absent host /\[mp\] session ended reason=(?!none \(shutdown\))/ before host /\[mp\] race test choice 3/'
  - 'count host /\[mp\] race armed serial=\d+/ == 2'
  - 'absent * /\[mp\] (race hold timeout|race drop)/'
  - 'count guest /\[mp\] race go received/ == 2'   # (the DSL has no `absent ... after`: it ignored "after" and failed on race 1's go) races 1 and 2 only, none after the leave
  - 'absent host /\[mp\] (slot \d left reason=(?!leave \(bye\))|rejected by host|hello rejected|bad message from slot)/'
