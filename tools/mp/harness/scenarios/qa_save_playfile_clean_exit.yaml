# final run (14 Nov), save case a: "Play This File" (SMG_MP_AUTO_SAVE=mine:2 = the menu's "Play on my file 2": a backup first, the session plays on the
# single-player root) with Safe saves OFF (SMG_ATOMIC_SAVES unset, the default). The game's own save (SMG_MP_TEST_SAVE) goes through the safe writer while a
# session is on, which leaves GameData.bin.mpbak beside the file; the host leaves and answers "save to my file" (SMG_MP_AUTO_LEAVE=single). The session is then over,
# GameData.bin reads and validates, no .mptmp is beside it: finishSession (MpSaveGame.cpp) removes the .mpbak the session made and logs
# "save removed <path>.mpbak (made by the session; Safe saves is off)". The run folder IS the scratch save folder (run_one.sh copies the test save into <run>/saves;
# the owner's real saves are never used).
# save_files judges the folder after the run: GameData.bin there, no GameData.bin.mpbak and no .mptmp.
# A crash or an undecided leave keeps the .mpbak on purpose (fail-safe): not tested here.
name: qa_save_playfile_clean_exit
description: "Play This File, Safe saves off, clean leave with save: the session's .mpbak is removed (log 'save removed ...mpbak'), the file is whole"
# seconds: the host's console only reaches the game at about 160 s of game time (the +30 stagger and two loads on 2 cores), THEN the session plays
# SMG_MP_TEST_LEAVE seconds and decides; 200 ended the run before the leave decision (final run 14 Nov: no 'leave decision' line). 330 = 160 + 70 + margin.
seconds: 330
requires: {strings: [SMG_MP_TEST_SAVE, SMG_MP_TEST_LEAVE]}
env: {PETARI_GAME_CLOCK: 1, PETARI_SHOT_MS: 10000}
processes:
  - name: host
    input: "@file2_observatory+30"
    env: {SMG_MP_AUTO: host, SMG_MP_AUTO_SAVE: "mine:2", SMG_MP_AUTO_MODE: together, SMG_MP_AUTO_START: 2, SMG_MP_TEST_SAVE: 20,
          SMG_MP_TEST_LEAVE: 70, SMG_MP_AUTO_LEAVE: single}
  - name: guest
    input: "@file2_observatory"
    env: {SMG_MP_AUTO: join, SMG_MP_AUTO_LEAVE: discard}
rules:
  - 'nocrash *'
  - 'nostall *'
  - 'save_guard guest'
  - 'absent * /Assertion|OSPanic|FATAL|ASSERT/'
  - 'expect host /\[mp\] save auto choice mine:2 ready/'
  - 'absent host /\[mp\] save auto choice \S+ FAILED/'
  - 'expect host /\[mp\] save test: game save requested/'
  - 'expect host /\[mp\] save write file=GameData\.bin ok=1/'
  - 'absent host /\[mp\] save write file=GameData\.bin ok=0/'
  - 'expect host /\[mp\] save test: leave decision single ok/'
  - 'expect host /\[mp\] save removed \S*\.mpbak \(made by the session; Safe saves is off\)/'
  - 'order host /\[mp\] save test: leave decision single ok/ before host /\[mp\] save removed / within 30s'
  - 'absent host /\[mp\] save kept \S*\.mpbak/'
  - 'save_valid host'
  - 'save_mine host 2'
  - 'save_files host present GameData.bin'
  - 'save_files host absent GameData.bin.mpbak GameData.bin.mptmp'
