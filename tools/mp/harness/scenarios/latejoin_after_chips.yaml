# chipsync: a console that joins AFTER Star Chips were collected gets them (worldsync OBJMAP kind 3). Star Chips register with their ChipGroup only after the placement is done,
# so the world registry never flagged one (chipsync fix: the placement name marks it). The host is alone in Good Egg 1 (a Yellow Chip group of 5); 5 s after the scene is live it
# collects 3 chips through the game's own pickup steps (SMG_MP_TEST_COLLECT "<secs>:<purple>:<chips>": ChipBase::mpRemoteGet runs noticeGetChip as an ItemGet does). No guest yet:
# the CHIP messages go to nobody. The guest console is STARTED by that mark (HARNESS_START_ON), boots, joins as a drop-in; the host answers its REGCRC with the objmap and the
# guest applies the 3 chips (each one taken on the guest, so it does not show them). Two chips are left: the group is not complete, no launch star yet.
name: latejoin_after_chips
description: "guest joins a galaxy after the host collected 3 of 5 Star Chips: the guest gets them (OBJMAP kind 3)"
seconds: 420
min_speed: 0.4
requires: {strings: [SMG_MP_AUTO_MODE, SMG_MP_TEST_COLLECT]}
env: {PETARI_GAME_CLOCK: 1, PETARI_SHOT_MS: 10000, PETARI_POSLOG: 1}
processes:
  - name: host
    input: "@file2_observatory"
    env: {SMG_MP_AUTO: host, SMG_MP_AUTO_SAVE: "copy:2", SMG_MP_AUTO_MODE: together, SMG_MP_AUTO_START: 1, PETARI_STAGE: "EggStarGalaxy:1", SMG_MP_TEST_COLLECT: "5:0:3"}
  - name: guest
    seconds: 300
    input: "@file2_observatory"
    env: {SMG_MP_AUTO: join, SMG_MP_LOOK: 1, HARNESS_START_ON: 'host|\[mp\] world test collect: purple=0 chip=3 |0'}
rules:
  - 'absent * /\[mp\] world pool ranges overflow/'
  - 'nocrash *'
  - 'nostall *'
  - 'save_guard *'
  - 'absent * /save check self-test failed|Assertion|OSPanic|FATAL/'
  - 'expect * /\[mp\] save check limits galaxies=[1-9]\d* /'
  - 'expect host /\[mp\] world test collect: purple=0 chip=3 \(registry purple=\d+ chip=[3-9]\d*\)/'
  - 'count host /\[mp\] world chip key=\S+ src=local/ == 3'
  - 'absent host /\[mp\] world kill key=\S+ src=local/'
  - 'expect host /\[mp\] slot 1 joined name=guest/ after host /\[mp\] world test collect: purple=0 chip=3/'
  - 'expect guest /\[mp\] flow move type=\d+ galaxy=EggStarGalaxy .*role=guest/ within 120s after host /\[mp\] slot 1 joined/'
  - 'expect guest /\[mp\] world reg n=\d+ crc=[0-9a-f]+ / after guest /\[mp\] flow move type=\d+ galaxy=EggStarGalaxy/'
  - 'same host,guest /\[mp\] world reg n=(\d+) crc=([0-9a-f]+) / last'
  - 'absent * /\[mp\] world regcrc mismatch/'
  # the host answers the joiner's REGCRC with the 3 chips, the guest applies exactly those
  - 'expect host /\[mp\] world objmap sent kill=0 purple=0 chip=3 chunks=[1-9]\d* to=1/ within 60s after guest /\[mp\] world reg n=/'
  - 'expect guest /\[mp\] world objmap applied kind=3 start=\d+ bits=3/ within 60s after guest /\[mp\] world reg n=/'
  - 'count guest /\[mp\] world chip key=\S+ src=remote/ == 3'   # idempotent: the repeated summaries never re-apply
  - 'absent guest /\[mp\] world drop type=chip/'
  # 3 of 5 taken: the group is not complete on either console, no launch star
  - 'absent * /\[mp\] world chip group done/'
  - 'absent * /\[mp\] bad message from slot|events lost/'
