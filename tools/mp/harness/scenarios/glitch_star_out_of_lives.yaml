# UNRUN (rules checked against the code's log lines by tests/mp/scenario_regex_test.py; the game has not played it). G1: the guest has 0 lives, falls (out-of-lives bubble: only a teammate's touch pops it), then the host's star arrives.
# Expected: popInPlace gives him 1 life back (MpBubble.cpp leaveBubble wasOut), star delivered once, no spectate left running into the star demo.
name: glitch_star_out_of_lives
description: "out-of-lives bubbled guest receives the host's star"
seconds: 300
requires: {strings: [SMG_MP_AUTO_MODE, SMG_MP_TEST_STAR, SMG_MP_TEST_DIE, SMG_MP_TEST_LIVES]}
env: {PETARI_GAME_CLOCK: 1, PETARI_SHOT_MS: 5000}
processes:
  - name: host
    input: "@file2_observatory+30"
    env: {SMG_MP_AUTO: host, SMG_MP_AUTO_SAVE: "copy:2", SMG_MP_AUTO_MODE: together, SMG_MP_AUTO_START: 2, PETARI_STAGE: "EggStarGalaxy:1", SMG_MP_TEST_STAR: 45}
  - name: guest
    input: "@file2_observatory"
    env: {SMG_MP_AUTO: join, SMG_MP_LOOK: 1, SMG_MP_TEST_LIVES: 0, SMG_MP_TEST_DIE: "20:1:abyss"}
rules:
  - 'nocrash *'
  - 'nostall *'
  - 'save_guard *'
  - 'expect guest /\[mp\] bubble on slot=1 lives=\d+->\d+ out=1/'
  - 'expect guest /\[mp\] spectate: start watching slot=0/ within 10s after guest /\[mp\] bubble on/'
  - 'expect guest /\[mp\] bubble off slot=1 .*why=star lives=1/ within 15s after guest /\[mp\] flow star got/'
  - 'expect guest /\[mp\] spectate: .*(end|stop)/ before guest /\[mp\] star delivered/'
  - 'expect host /\[mp\] flow star got id=\d+ grand=\d by=0/'
  - 'expect host /\[mp\] puppet slot=1 appear model=\w+ self=0/'
  - 'absent host /\[mp\] bubble on slot=0/'
  - 'count guest /\[mp\] star delivered id=/ == 1'
  - 'absent * /\[mp\] (star delivered .*path=record|flow clear hold timeout)/'
