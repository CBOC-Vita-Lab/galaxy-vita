# Pre-ship #8 + kill -9 recovery: the guest is killed (SIGKILL) in Good Egg after a recovery checkpoint; the same console
# (guest2 = guest's saves and mp/ root) boots again and rejoins: the host takes it back, the recovery checkpoint is found.
name: mp_recover
description: kill -9 a guest mid-session, restart it from its own saves; rejoin; recovery pending/offered; SP untouched
seconds: 500   # (the autopilot now boots to play first: ~90 game s of menus, then the recovery timer, then guest2 boots again: 330 was too short)
requires: {strings: [SMG_MP_AUTO_MODE]}
env: {PETARI_GAME_CLOCK: 1, PETARI_SHOT_MS: 10000}
processes:
  - name: host
    input: "@file2_observatory+30"
    env: {SMG_MP_AUTO: host, SMG_MP_AUTO_SAVE: "copy:2", SMG_MP_AUTO_MODE: together, SMG_MP_AUTO_START: 2, PETARI_STAGE: "EggStarGalaxy:1"}
  - name: guest
    input: "@file2_observatory"
    env: {SMG_MP_AUTO: join, HARNESS_KILL: 'save recovery written|5|9'}
  - name: guest2
    seconds: 210
    input: "@file2_observatory"
    env: {SMG_MP_AUTO: join, HARNESS_AFTER: guest, HARNESS_CONTINUE: guest}
rules:
  - 'nocrash *'
  - 'nostall *'
  - 'save_guard *'
  - 'absent * /save check self-test failed/'
  - 'expect * /\[mp\] save check limits galaxies=[1-9]\d* /'
  - 'expect guest /\[mp\] save recovery written index=\d+ bytes=\d+ ms=\d+ ok=1/'
  - 'expect host /\[mp\] slot 1 left reason=/ within 30s after guest /harness: kill signal=9/'
  - 'expect host /\[mp\] slot 1 left reason=timeout \(lost\) players=1/ within 20s after guest /harness: kill signal=9/'
  - 'expect host /\[mp\] slot \d joined name=guest rejoin=\d .*players=2/ within 120s after guest2 /harness: process start/'
  # the same console (same name, port, VIP, saves) coming back: recognised as a rejoin of its old slot (matched in every retained run)
  - 'expect host /\[mp\] slot 1 joined name=guest rejoin=1 /'
  - 'expect guest2 /\[mp\] flow command where .*galaxy=EggStarGalaxy/'
  - 'expect guest2 /\[mp\] puppet slot=0 appear model=Mario self=0/'
  # a late joiner into a running scene should not sit out the whole 20 s barrier timeout
  - 'expect guest2 /\[mp\] flow barrier release serial=\d+ waited=\d{1,4}ms/'
  # (the recovery OFFER is a menu event: the autopilot never opens the Multiplayer menu, so a rule for it here could never match; mp_recover_offer.yaml does it through the menu)
