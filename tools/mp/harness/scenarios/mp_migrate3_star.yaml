# g2 gets the scenario star, the host dies 0.05 s after it relayed it: g1 (and the new host) still get the star
name: mp_migrate3_star
description: "g2 gets the scenario star, the host dies 0.05 s after it relayed it: g1 (and the new host) still get the star"
seconds: 260
requires: {strings: [SMG_MP_AUTO_MODE]}
env: {PETARI_GAME_CLOCK: 1, PETARI_SHOT_MS: 10000}
processes:
  - name: host
    input: "@file2_observatory+30"
    env: {SMG_MP_AUTO: host, SMG_MP_AUTO_SAVE: "copy:2", SMG_MP_AUTO_MODE: together, SMG_MP_AUTO_START: 2, PETARI_STAGE: "EggStarGalaxy:1", HARNESS_KILL: 'flow star got id=\d+ grand=\d by=\d|0.05|9'}
  - name: g1
    input: "@file2_observatory"
    env: {SMG_MP_AUTO: join}
  - name: g2
    input: "@file2_observatory"
    env: {SMG_MP_AUTO: join, SMG_MP_TEST_STAR: 15}
rules:
  - '?absent * /\[mp\] world regcrc mismatch/'
  - 'nocrash *'
  - 'save_guard *'
  - 'absent * /save check self-test failed/'
  - 'expect * /\[mp\] save check limits galaxies=[1-9]\d* /'
  - 'nostall g1,g2'
  - 'expect host /\[mp\] slot [12] joined name=g[12] .*players=3/'
  - 'expect host /harness: kill signal=9/'
  - 'expect any /\[mp\] flow host now slot=\d epoch=\d+/ within 30s after host /harness: kill signal=9/'
  - 'absent g1,g2 /Assertion|OSPanic|FATAL/'
  - 'exit g1,g2 == 0'
